[workspace]
members = [
    "crates/storyteller-core",
    "crates/storyteller-ui",
]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
quick-xml = "0.38"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = "1.17.1"
slint-build = "1.17.1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
