name: Temporary dark and light theme checkpoint
on:
  push:
    branches: [feature/optional-whisper-gpu]
permissions:
  contents: read
concurrency:
  group: dark-theme-checkpoint
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        id: format
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Strict locked UI lint
        id: lint
        continue-on-error: true
        run: cargo clippy -p storyteller-ui --all-targets --locked -- -D warnings
      - name: UI regressions
        id: tests
        continue-on-error: true
        run: cargo test -p storyteller-ui --locked
      - name: Native Slint build
        id: build
        continue-on-error: true
        run: cargo build -p storyteller-ui --locked
      - name: Both themes, keyboard switching and saved appearance
        id: scenes
        continue-on-error: true
        run: cargo run --locked -p storyteller-ui --example ui_snapshot -- tools/ui/fixtures.json ui-snapshots
      - name: Native scene artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-ui-themes
          path: ui-snapshots/*.ppm
          if-no-files-found: error
          retention-days: 7
      - name: Require every checkpoint gate
        if: ${{ always() && (steps.format.outcome != 'success' || steps.lint.outcome != 'success' || steps.tests.outcome != 'success' || steps.build.outcome != 'success' || steps.scenes.outcome != 'success') }}
        shell: pwsh
        run: throw 'A required theme checkpoint gate did not pass. Inspect every earlier step before retrying.'
