name: Temporary optional Whisper formatting check
on:
  push:
    branches: [feature/optional-whisper-gpu]
permissions:
  contents: read
concurrency:
  group: optional-whisper-checkpoint
  cancel-in-progress: true
jobs:
  format:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Formatting
        run: cargo fmt --all -- --check
