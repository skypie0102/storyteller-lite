name: P5 recovery backup validation

on:
  pull_request:
    branches:
      - validation/p5-recovery-backup-base

permissions:
  contents: write

jobs:
  validate:
    name: Windows recovery backup validation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/p5-recovery-backup

      - name: Apply reviewed recovery-backup patch
        run: python .github/apply_p5_recovery_backup.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Apply rustfmt before validation
        run: cargo fmt --all

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Strict core Clippy
        run: cargo clippy -p storyteller-core --all-targets -- -D warnings

      - name: Core tests
        run: cargo test -p storyteller-core

      - name: Commit validated product file
        shell: pwsh
        run: |
          git config user.name "storyteller-validation"
          git config user.email "actions@users.noreply.github.com"
          git add crates/storyteller-core/src/job_recovery.rs
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "fix: make queue recovery publication crash safe [skip ci]"
          git push origin HEAD:feature/p5-recovery-backup
