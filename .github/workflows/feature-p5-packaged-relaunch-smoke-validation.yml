name: P5 packaged relaunch smoke validation

on:
  pull_request:
    branches:
      - validation/p5-packaged-relaunch-smoke-base
    paths:
      - .github/scripts/packaged-relaunch-smoke.ps1
      - .github/workflows/windows-build.yml
      - .github/workflows/feature-p5-packaged-relaunch-smoke-validation.yml

permissions:
  contents: read

concurrency:
  group: p5-packaged-relaunch-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package-smoke:
    name: Windows packaged relaunch smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/p5-packaged-relaunch-smoke
          fetch-depth: 0

      - name: Check patch whitespace
        shell: pwsh
        run: git diff --check validation/p5-packaged-relaunch-smoke-base...HEAD

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build locked release executable
        run: cargo build --locked --release -p storyteller-ui

      - name: Stage packaged executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\storyteller-ui.exe dist\StoryTeller-Lite.exe

      - name: Smoke-test packaged relaunch recovery
        shell: pwsh
        run: |
          & .github\scripts\packaged-relaunch-smoke.ps1 -Executable dist\StoryTeller-Lite.exe
