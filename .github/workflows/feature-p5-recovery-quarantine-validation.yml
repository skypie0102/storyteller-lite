name: P5 recovery quarantine validation

on:
  pull_request:
    branches:
      - validation/p5-recovery-quarantine-base

permissions:
  contents: write

concurrency:
  group: storyteller-lite-p5-recovery-quarantine-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows recovery quarantine validation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/p5-recovery-quarantine

      - name: Apply reviewed recovery-quarantine patch
        run: python .github/apply_p5_recovery_quarantine.py

      - name: Check patch whitespace
        shell: bash
        run: git diff --check

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Apply rustfmt before validation
        run: cargo fmt --all

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Strict UI Clippy
        run: cargo clippy -p storyteller-ui --all-targets -- -D warnings

      - name: UI tests
        run: cargo test -p storyteller-ui

      - name: Build native Slint shell
        run: cargo build -p storyteller-ui

      - name: Commit validated product files
        shell: bash
        run: |
          git config user.name "storyteller-validation"
          git config user.email "actions@users.noreply.github.com"
          git add crates/storyteller-ui/src/recovery_state.rs crates/storyteller-ui/src/worker_bridge.rs
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "fix: preserve unreadable recovery state [skip ci]"
          git push origin HEAD:feature/p5-recovery-quarantine
