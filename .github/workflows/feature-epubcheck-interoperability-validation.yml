name: P5 EPUBCheck interoperability validation

on:
  pull_request:
    branches:
      - validation/epubcheck-interoperability-base

permissions:
  contents: write

concurrency:
  group: storyteller-lite-epubcheck-feature-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature head
        uses: actions/checkout@v7
        with:
          ref: feature/epubcheck-interoperability

      - name: Apply reviewed conformance transform
        run: python .github/apply_epubcheck_fix.py

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Format patched Rust source
        run: cargo fmt --all

      - name: Rust formatting
        id: fmt
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Strict core Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy -p storyteller-core --all-targets -- -D warnings

      - name: Core tests
        id: tests
        continue-on-error: true
        run: cargo test -p storyteller-core

      - name: Export standards-clean EPUB fixtures
        id: export
        continue-on-error: true
        run: cargo run -p storyteller-core --example export_epubcheck_fixtures -- target/epubcheck-fixtures

      - name: Download and verify EPUBCheck 5.4.0
        id: download
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version="5.4.0"
          expected_sha256="33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c"
          archive="$RUNNER_TEMP/epubcheck-${version}.zip"
          extract_dir="$RUNNER_TEMP/epubcheck-${version}"
          curl --fail --location --silent --show-error \
            "https://github.com/w3c/epubcheck/releases/download/v${version}/epubcheck-${version}.zip" \
            --output "$archive"
          echo "${expected_sha256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$extract_dir"
          unzip -q "$archive" -d "$extract_dir"
          jar_path="$(find "$extract_dir" -type f -name epubcheck.jar -print -quit)"
          test -n "$jar_path"
          echo "EPUBCHECK_JAR=$jar_path" >> "$GITHUB_ENV"

      - name: Validate exported EPUBs with EPUBCheck
        id: epubcheck
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t fixtures < <(find target/epubcheck-fixtures -maxdepth 1 -type f -name '*.epub' -print | sort)
          if [[ "${#fixtures[@]}" -ne 3 ]]; then
            printf 'expected 3 EPUBCheck fixtures, found %s\n' "${#fixtures[@]}" >&2
            exit 1
          fi
          failed=0
          for fixture in "${fixtures[@]}"; do
            echo "== EPUBCheck: $fixture =="
            if ! java -jar "$EPUBCHECK_JAR" "$fixture"; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Aggregate validation result
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for gate in \
            "fmt:${{ steps.fmt.outcome }}" \
            "clippy:${{ steps.clippy.outcome }}" \
            "tests:${{ steps.tests.outcome }}" \
            "export:${{ steps.export.outcome }}" \
            "download:${{ steps.download.outcome }}" \
            "epubcheck:${{ steps.epubcheck.outcome }}"; do
            echo "$gate"
            if [[ "${gate#*:}" != "success" ]]; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Commit validated source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "storyteller-validation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            crates/storyteller-core/examples/export_epubcheck_fixtures.rs \
            crates/storyteller-core/src/epub_graphic.rs \
            crates/storyteller-core/src/epub_overlay.rs \
            crates/storyteller-core/src/epub_validate.rs
          git diff --cached --check
          git commit -m "fix: make media overlays EPUBCheck-conformant"
          git push origin HEAD:feature/epubcheck-interoperability
