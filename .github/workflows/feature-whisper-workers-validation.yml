name: Whisper chunk workers validation

on:
  push:
    branches:
      - feature/whisper-chunk-workers

permissions:
  contents: write

concurrency:
  group: whisper-chunk-workers-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Apply feature contract cleanups
        shell: pwsh
        run: |
          $mainPath = 'crates/storyteller-ui/src/main.rs'
          $main = Get-Content -Raw $mainPath
          $main = $main.Replace('if !(1..=16).contains(&workers) {', 'if !(1..=4).contains(&workers) {')
          $main = $main.Replace('Whisper workers must be between 1 and 16.', 'Whisper workers must be between 1 and 4.')
          $main = $main.Replace('assert_eq!(parse_whisper_workers("16").unwrap(), 16);', 'assert_eq!(parse_whisper_workers("4").unwrap(), 4);')
          $main = $main.Replace('assert!(parse_whisper_workers("17").is_err());', 'assert!(parse_whisper_workers("5").is_err());')
          Set-Content -NoNewline -Path $mainPath -Value $main

          $backendPath = 'crates/storyteller-ui/src/pipeline_backend.rs'
          $backend = Get-Content -Raw $backendPath
          $oldIdentity = '    let whisper_identity = file_identity("whisper.cpp-cli", &whisper_cli);'
          $newIdentity = "    let ffmpeg_identity = file_identity(`"ffmpeg-analyze`", &ffmpeg);`n    let whisper_identity = file_identity(`"whisper.cpp-cli`", &whisper_cli);"
          $backend = $backend.Replace($oldIdentity, $newIdentity)
          $backend = $backend.Replace('storyteller:chunked-whisper-v1|{whisper_identity}', 'storyteller:chunked-whisper-v1|{ffmpeg_identity}|{whisper_identity}')
          Set-Content -NoNewline -Path $backendPath -Value $backend

          $runtimePath = 'docs/RUNTIME.md'
          $runtime = Get-Content -Raw $runtimePath
          $start = $runtime.IndexOf('## Analyze artifacts')
          $end = $runtime.IndexOf('## Progress policy')
          if ($start -lt 0 -or $end -le $start) { throw 'Could not locate Analyze artifacts section in docs/RUNTIME.md' }
          $replacement = @'
          ## Analyze artifacts

          Analyze no longer creates a whole-book PCM checkpoint. It plans deterministic bounded transcription chunks, preferring nearby chapter boundaries and refining synthetic cuts around detected silence when useful. Each active worker converts only its current range to temporary 16 kHz mono signed 16-bit PCM, runs whisper.cpp on that bounded WAV, then deletes the temporary PCM after the chunk result is collected.

          Analyze records these durable stage artifacts:

          - `book-corpus.json` — extracted EPUB reading-order corpus
          - `transcription-plan.json` — audiobook duration and deterministic chunk boundaries
          - `transcript.json` — normalized merged Whisper transcript with global audiobook timestamps

          The worker count is an execution-only setting (1–4 simultaneous chunks, default 1). Available logical CPU threads are divided across the workers that are actually active. Changing worker count does not invalidate semantic stage checkpoints.

          Both ffmpeg and whisper.cpp identities participate in the Analyze backend fingerprint because ffmpeg is part of chunk planning/conversion as well as Whisper input preparation.

          '@
          $runtime = $runtime.Substring(0, $start) + $replacement + $runtime.Substring($end)
          Set-Content -NoNewline -Path $runtimePath -Value $runtime

      - name: Apply safe Clippy fixes
        run: cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged

      - name: Apply Rust formatting
        run: cargo fmt --all

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Build native Slint shell
        run: cargo build -p storyteller-ui

      - name: Commit validated maintenance
        shell: bash
        run: |
          if git diff --quiet -- crates docs; then
            echo "No maintenance changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates docs
            git commit -m "chore: apply validated Whisper worker maintenance"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
