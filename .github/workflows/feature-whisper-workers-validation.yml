name: Whisper chunk workers validation

on:
  push:
    branches:
      - feature/whisper-chunk-workers

permissions:
  contents: write

concurrency:
  group: whisper-chunk-workers-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Apply Rust formatting
        run: cargo fmt --all

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Build native Slint shell
        run: cargo build -p storyteller-ui

      - name: Commit formatting if validation passed
        shell: bash
        run: |
          if git diff --quiet -- crates; then
            echo "No rustfmt changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates
            git commit -m "chore: apply rustfmt to Whisper worker feature"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
