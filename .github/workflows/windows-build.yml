name: Windows test build

# One-shot trigger for the runtime dependency manager checkpoint.
# This is returned to manual-only after the artifact is produced.
on:
  push:
    branches:
      - recovery/rust-slint
    paths:
      - .github/workflows/windows-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storyteller-lite-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validate and package Windows x64 build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Build release executable
        run: cargo build --locked --release -p storyteller-ui

      - name: Assemble developer-test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\storyteller-ui.exe dist\StoryTeller-Lite.exe
          @'
          StoryTeller Lite — Windows developer-test build

          Launch:
            Double-click StoryTeller-Lite.exe

          Runtime manager:
            Open Settings. StoryTeller Lite scans for ffmpeg, whisper.cpp, and the
            large-v3-turbo model. Existing working dependencies are reused. If any
            dependency is missing, choose Download missing to install verified copies
            into the portable tools\ and models\ folders beside the app.

          Automatic downloads are user-initiated. The default Whisper model is about
          1.62 GB. ffmpeg, whisper.cpp, and the model are checksum/digest verified.

          Environment-variable overrides remain supported:
            STORYTELLER_FFMPEG
            STORYTELLER_WHISPER
            STORYTELLER_WHISPER_MODEL

          This is a developer-test build, not a public release. Installer/signing,
          EPUBCheck interoperability, and release polish are still pending.
          '@ | Set-Content -Encoding UTF8 dist\README.txt
          "commit=${env:GITHUB_SHA}" | Set-Content -Encoding ASCII dist\BUILD.txt
          (Get-FileHash dist\StoryTeller-Lite.exe -Algorithm SHA256).Hash + "  StoryTeller-Lite.exe" | Set-Content -Encoding ASCII dist\SHA256SUMS.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: StoryTeller-Lite-Windows-x64-RuntimeManager
          path: dist/
          if-no-files-found: error
          retention-days: 3
