name: Windows test build

# Temporary one-shot push trigger for the CUDA runtime-discovery package.
on:
  workflow_dispatch:
  push:
    branches:
      - recovery/rust-slint
    paths:
      - .github/workflows/windows-build.yml

permissions:
  contents: read

concurrency:
  group: storyteller-lite-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validate and package Windows x64 build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Build release executable
        run: cargo build --locked --release -p storyteller-ui

      - name: Assemble developer-test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\storyteller-ui.exe dist\StoryTeller-Lite.exe
          @'
          StoryTeller Lite — Windows developer-test build

          Runtime manager:
            Open Settings. StoryTeller Lite detects ffmpeg, whisper.cpp, and the
            large-v3-turbo model from supported existing locations.

          CUDA whisper.cpp:
            - Existing CUDA-capable whisper.cpp builds are preferred automatically.
            - Legacy whisper-cli.exe and main.exe layouts are supported.
            - Persistent StoryTeller/whisper caches under Windows user/system data
              locations are scanned with bounded depth.
            - A cached whisper-cpp-windows-x64-cuda-*.tar.gz/.tgz/.zip can be reused.
            - If whisper.cpp is missing and an NVIDIA GPU is detected, Download missing
              prefers an official CUDA-enabled Windows x64 whisper.cpp asset.

          Automatic downloads are user-initiated. The default Whisper model is about
          1.62 GB. Downloaded ffmpeg, whisper.cpp, and model files are checksum/digest
          verified before they are accepted.

          This is a developer-test build, not a public release.
          '@ | Set-Content -Encoding UTF8 dist\README.txt
          "commit=${env:GITHUB_SHA}" | Set-Content -Encoding ASCII dist\BUILD.txt
          (Get-FileHash dist\StoryTeller-Lite.exe -Algorithm SHA256).Hash + "  StoryTeller-Lite.exe" | Set-Content -Encoding ASCII dist\SHA256SUMS.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: StoryTeller-Lite-Windows-x64-CUDA-Discovery
          path: dist/
          if-no-files-found: error
          retention-days: 3
