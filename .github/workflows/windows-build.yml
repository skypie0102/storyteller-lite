name: Windows test build

# Temporary one-shot push trigger for validating local whisper archive import.
on:
  workflow_dispatch:
  push:
    branches:
      - recovery/rust-slint
    paths:
      - .github/workflows/windows-build.yml

permissions:
  contents: write

concurrency:
  group: storyteller-lite-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validate and package Windows x64 build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Apply rustfmt and commit source
        shell: bash
        run: |
          cargo fmt --all
          if git diff --quiet -- crates/storyteller-ui/src; then
            echo "No Rust formatting changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/storyteller-ui/src
            git commit -m "style: format whisper archive importer"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "Validated working-tree commit: $(git rev-parse HEAD)"

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Build release executable
        run: cargo build --locked --release -p storyteller-ui

      - name: Assemble developer-test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\storyteller-ui.exe dist\StoryTeller-Lite.exe
          @'
          StoryTeller Lite — Windows developer-test build

          Local whisper.cpp archive import:
            Open Settings and choose Import whisper archive…
            Select a .zip, .tgz, or .tar.gz such as:
              whisper-cpp-windows-x64-cuda-13.1.0.tar.gz

            Lite extracts the selected local archive into:
              %LOCALAPPDATA%\Storyteller OneClick Lite\runtime\whisper\

            The archive is not uploaded. Lite locates whisper-cli.exe or legacy
            main.exe inside the extracted build, starts it with --help to verify the
            runtime can load, selects it immediately, and reuses the persistent copy
            on later launches.

          Automatic downloads remain user-initiated. This is a developer-test build,
          not a public release.
          '@ | Set-Content -Encoding UTF8 dist\README.txt
          "commit=$(git rev-parse HEAD)" | Set-Content -Encoding ASCII dist\BUILD.txt
          (Get-FileHash dist\StoryTeller-Lite.exe -Algorithm SHA256).Hash + "  StoryTeller-Lite.exe" | Set-Content -Encoding ASCII dist\SHA256SUMS.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: StoryTeller-Lite-Windows-x64-Whisper-Archive-Import
          path: dist/
          if-no-files-found: error
          retention-days: 3
