name: Smart audio review validation

on:
  push:
    branches:
      - feature/smart-audio-review

permissions:
  contents: write

concurrency:
  group: smart-audio-review-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Wire durable review drafts into pipeline
        shell: pwsh
        run: |
          $backendPath = 'crates/storyteller-ui/src/pipeline_backend.rs'
          $backend = Get-Content -Raw $backendPath
          $backend = $backend.Replace('align_transcript_to_corpus, build_readaloud_epub, create_audio_review_report, encode_audiobook,', 'align_transcript_to_corpus, build_readaloud_epub, create_audio_review_report_with_draft, encode_audiobook,')
          $backend = $backend.Replace('write_validation_report, AudioCodec, HardwareProfile, Job, JobWorkspace, LiveMetrics,', 'write_validation_report, AudioCodec, AudioReviewPolicy, HardwareProfile, Job, JobWorkspace, LiveMetrics,')
          $backend = $backend.Replace('        let report_path = stage_dir.join("review.json");', "        let report_path = stage_dir.join(`"review.json`");`n        let draft_path = context.workspace().root().join(`"review-draft.json`");")
          $backend = $backend.Replace('        let summary = create_audio_review_report(&alignment_path, &report_path)', "        let summary = create_audio_review_report_with_draft(`n            &alignment_path,`n            &report_path,`n            Some(&draft_path),`n            AudioReviewPolicy::Smart,`n        )")
          $backend = $backend.Replace('        if summary.unmatched_segments == 0 {', '        if summary.pending_segments == 0 {')
          $backend = $backend.Replace('"No unmatched audio segments require review"', 'if summary.unmatched_segments == 0 { "No unmatched audio segments require review" } else { "Saved audio review decisions restored" }')
          $backend = $backend.Replace('                        summary.unmatched_segments,', '                        summary.pending_segments,')
          $backend = $backend.Replace('                        if summary.unmatched_segments == 1 {', '                        if summary.pending_segments == 1 {')
          $backend = $backend.Replace('        if !review.unmatched.is_empty() && !review.accepted_unmatched_exclusion {', '        if !review.is_complete() {')
          Set-Content -NoNewline -Path $backendPath -Value $backend

          $bridgePath = 'crates/storyteller-ui/src/worker_bridge.rs'
          $bridge = Get-Content -Raw $bridgePath
          $bridge = $bridge.Replace('accept_unmatched_audio_exclusion, read_audio_review_report, AudioReviewReport, Job, JobOutcome,', 'accept_unmatched_audio_exclusion_with_draft, read_audio_review_report, AudioReviewReport, Job, JobOutcome,')
          $bridge = $bridge.Replace("fn audio_review_path(job: &Job) -> std::path::PathBuf {", "fn audio_review_draft_path(job: &Job) -> std::path::PathBuf {`n    pipeline_backend::job_workspace(job).root().join(`"review-draft.json`")`n}`n`nfn audio_review_path(job: &Job) -> std::path::PathBuf {")
          $bridge = $bridge.Replace('    accept_unmatched_audio_exclusion(&audio_review_path(job))', '    accept_unmatched_audio_exclusion_with_draft(&audio_review_path(job), &audio_review_draft_path(job))')
          Set-Content -NoNewline -Path $bridgePath -Value $bridge

          $buildPath = 'crates/storyteller-core/src/epub_build.rs'
          $build = Get-Content -Raw $buildPath
          $build = $build.Replace('    if !review.unmatched.is_empty() && !review.accepted_unmatched_exclusion {', '    if !review.is_complete() {')
          Set-Content -NoNewline -Path $buildPath -Value $build

      - name: Apply Rust formatting
        run: cargo fmt --all

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Build native Slint shell
        run: cargo build -p storyteller-ui

      - name: Commit validated review-draft wiring
        shell: bash
        run: |
          if git diff --quiet -- crates; then
            echo "No wiring changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates
            git commit -m "feat: persist per-segment audio review drafts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
