name: Temporary native UI rebuild checkpoint
on:
  push:
    branches: [rebuild/reliability-foundation]
permissions:
  contents: read
concurrency:
  group: native-ui-rebuild-checkpoint
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        id: format
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Strict locked workspace lint
        id: lint
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace regressions
        id: tests
        continue-on-error: true
        run: cargo test --workspace --locked
      - name: Native Slint build
        id: build
        continue-on-error: true
        run: cargo build -p storyteller-ui --locked
      - name: Compiled Slint scenes and interaction checks
        id: scenes
        continue-on-error: true
        run: cargo run --locked -p storyteller-ui --example ui_snapshot -- tools/ui/fixtures.json ui-snapshots
      - name: Packaged relaunch recovery
        id: recovery
        continue-on-error: true
        if: ${{ steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./.github/scripts/packaged-relaunch-smoke.ps1 -Executable (Resolve-Path 'target/debug/storyteller-ui.exe').Path
      - name: Native scene artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: native-ui-scenes
          path: ui-snapshots/*.ppm
          if-no-files-found: warn
          retention-days: 7
      - name: Require every checkpoint gate
        if: ${{ always() && (steps.format.outcome != 'success' || steps.lint.outcome != 'success' || steps.tests.outcome != 'success' || steps.build.outcome != 'success' || steps.scenes.outcome != 'success' || steps.recovery.outcome != 'success') }}
        shell: pwsh
        run: throw 'A required native UI checkpoint gate did not pass. Inspect every earlier step before retrying.'
