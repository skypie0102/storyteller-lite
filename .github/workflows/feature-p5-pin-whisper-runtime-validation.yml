name: P5 pinned whisper runtime validation

on:
  pull_request:
    branches:
      - validation/p5-pin-whisper-runtime-base

permissions:
  contents: write

jobs:
  validate:
    name: Windows pinned whisper runtime validation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/p5-pin-whisper-runtime

      - name: Apply reviewed pinned-whisper patch
        run: python .github/apply_p5_pin_whisper_runtime.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Apply rustfmt before validation
        run: cargo fmt --all

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Strict UI Clippy
        run: cargo clippy -p storyteller-ui --all-targets -- -D warnings

      - name: UI tests
        run: cargo test -p storyteller-ui

      - name: Build native Slint shell
        run: cargo build -p storyteller-ui

      - name: Commit validated product file
        shell: pwsh
        run: |
          git config user.name "storyteller-validation"
          git config user.email "actions@users.noreply.github.com"
          git add crates/storyteller-ui/src/runtime_setup.rs
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "fix: pin automatic whisper runtime build [skip ci]"
          git push origin HEAD:feature/p5-pin-whisper-runtime
