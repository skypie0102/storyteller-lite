name: Smart edge evidence validation

on:
  push:
    branches:
      - feature/smart-edge-evidence

permissions:
  contents: write

concurrency:
  group: smart-edge-evidence-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Wire smart edge evidence
        run: python .github/scripts/patch-smart-edge-evidence.py

      - name: Update review assignment fixture
        run: python .github/scripts/fix-smart-edge-evidence-fixture.py

      - name: Apply Rust formatting
        run: cargo fmt --all

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Build native Slint shell
        run: cargo build -p storyteller-ui

      - name: Commit validated smart edge evidence
        shell: bash
        run: |
          if git diff --quiet -- crates; then
            echo "No smart edge evidence changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates
            git commit -m "feat: add bounded edge silence evidence"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
