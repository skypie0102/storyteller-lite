name: Temporary final Whisper progress regressions
on:
  push:
    branches: [feature/whisper-live-progress]
permissions:
  contents: read
concurrency:
  group: whisper-progress-checkpoint
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        id: format
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Strict locked core and application lint
        id: lint
        continue-on-error: true
        run: cargo clippy -p storyteller-core -p storyteller-application --all-targets --locked -- -D warnings
      - name: Core and application regressions including hours-long activity
        id: tests
        continue-on-error: true
        run: cargo test -p storyteller-core -p storyteller-application --locked
      - name: Require every final progress gate
        if: ${{ always() && (steps.format.outcome != 'success' || steps.lint.outcome != 'success' || steps.tests.outcome != 'success') }}
        shell: pwsh
        run: throw 'A final progress checkpoint gate did not pass. Inspect every earlier step before retrying.'
