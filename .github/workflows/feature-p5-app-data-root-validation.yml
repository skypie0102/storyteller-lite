name: P5 app data root validation

on:
  pull_request:
    branches:
      - validation/p5-app-data-root-base

permissions:
  contents: write

concurrency:
  group: storyteller-lite-p5-app-data-root-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows app data root validation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/p5-app-data-root

      - name: Apply reviewed app-data-root patch
        run: python .github/apply_p5_app_data_root.py

      - name: Check patch whitespace
        shell: bash
        run: git diff --check

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Apply rustfmt before validation
        run: cargo fmt --all

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Strict UI Clippy
        run: cargo clippy -p storyteller-ui --all-targets -- -D warnings

      - name: UI tests
        run: cargo test -p storyteller-ui

      - name: Build native Slint shell
        run: cargo build -p storyteller-ui

      - name: Commit validated product files
        shell: bash
        run: |
          git config user.name "storyteller-validation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            crates/storyteller-ui/src/app_paths.rs \
            crates/storyteller-ui/src/main.rs \
            crates/storyteller-ui/src/runtime_import.rs \
            crates/storyteller-ui/src/runtime_setup.rs \
            crates/storyteller-ui/src/recovery_state.rs
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "refactor: centralize app data roots [skip ci]"
          git push origin HEAD:feature/p5-app-data-root
