name: Review image candidate validation

on:
  push:
    branches:
      - feature/review-image-candidates

permissions:
  contents: write

concurrency:
  group: storyteller-lite-review-image-candidates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Apply cancellation API fix
        shell: pwsh
        run: |
          $path = 'crates/storyteller-core/src/review_image.rs'
          $content = Get-Content -Raw $path
          $content = $content.Replace('cancellation.cancel();', 'cancellation.request();')
          Set-Content -NoNewline -Encoding utf8 $path $content

      - name: Apply Rust formatting
        run: cargo fmt --all

      - name: Rust formatting check
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Build native Slint shell
        run: cargo build -p storyteller-ui

      - name: Commit validated source
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/storyteller-core/src/review_image.rs
          git commit -m "fix: validate review image candidates"
          git push
