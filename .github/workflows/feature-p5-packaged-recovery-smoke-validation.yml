name: P5 packaged recovery smoke validation

on:
  pull_request:
    branches:
      - validation/p5-packaged-recovery-smoke-base

permissions:
  contents: write

jobs:
  validate:
    name: Windows packaged recovery smoke validation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply reviewed packaged-recovery smoke hook
        run: python .github/apply_p5_packaged_recovery_smoke.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Apply rustfmt before validation
        run: cargo fmt --all

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Strict UI Clippy
        run: cargo clippy -p storyteller-ui --all-targets -- -D warnings

      - name: UI tests
        run: cargo test -p storyteller-ui

      - name: Build release executable
        run: cargo build --locked --release -p storyteller-ui

      - name: Run packaged recovery smoke
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "storyteller-packaged-recovery-smoke"
          New-Item -ItemType Directory -Force $smokeRoot | Out-Null
          $env:LOCALAPPDATA = $smokeRoot
          & .\target\release\storyteller-ui.exe --recovery-smoke
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged recovery smoke exited with code $LASTEXITCODE"
          }
          $managed = Join-Path $smokeRoot "Storyteller OneClick Lite"
          if (Test-Path $managed) {
            $leftovers = Get-ChildItem -LiteralPath $managed -Force -Recurse
            if ($leftovers) {
              throw "Packaged recovery smoke left persistent artifacts behind: $($leftovers.FullName -join ', ')"
            }
          }

      - name: Commit validated product files
        shell: pwsh
        run: |
          git config user.name "storyteller-validation"
          git config user.email "actions@users.noreply.github.com"
          git add crates/storyteller-ui/src/main.rs crates/storyteller-ui/src/recovery_smoke.rs
          if (git diff --cached --quiet) {
            exit 0
          }
          git commit -m "test: add packaged recovery smoke mode [skip ci]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
