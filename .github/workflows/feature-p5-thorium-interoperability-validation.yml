name: P5 Thorium interoperability validation

on:
  pull_request:
    branches:
      - validation/p5-thorium-interoperability-base

permissions:
  contents: read

jobs:
  validate:
    name: Validate Thorium reading-system smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Check patch whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Export StoryTeller interoperability fixtures
        run: cargo run -p storyteller-core --example export_epubcheck_fixtures -- target/epubcheck-fixtures

      - name: Download and verify Thorium 3.5.1
        shell: bash
        run: |
          set -euo pipefail
          version="3.5.1"
          expected_sha256="72ab951d4963500b68c91a6496c662f30698dc27422a1b1af720b1cfbdfd327e"
          package="$RUNNER_TEMP/Thorium-${version}-amd64.deb"
          curl --fail --location --silent --show-error \
            "https://github.com/edrlab/thorium-reader/releases/download/v${version}/Thorium-${version}-amd64.deb" \
            --output "$package"
          echo "${expected_sha256}  ${package}" | sha256sum --check --strict
          echo "THORIUM_DEB=$package" >> "$GITHUB_ENV"

      - name: Install Thorium and headless display support
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb xauth "$THORIUM_DEB"

      - name: Exercise exact smoke script
        shell: bash
        env:
          THORIUM_EXPECTED_VERSION: "3.5.1"
        run: bash .github/scripts/thorium-reader-smoke.sh target/epubcheck-fixtures

      - name: Verify permanent manual workflow remains dispatch-only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/thorium-validation.yml').read_text(encoding='utf-8')
          if 'workflow_dispatch:' not in text or 'pull_request:' in text:
              raise SystemExit('Permanent Thorium workflow must remain manual-only.')
          if '72ab951d4963500b68c91a6496c662f30698dc27422a1b1af720b1cfbdfd327e' not in text:
              raise SystemExit('Pinned Thorium package digest is missing.')
          PY
