name: P5 relaunch recovery validation

on:
  pull_request:
    branches:
      - validation/p5-relaunch-recovery-base

permissions:
  contents: write

concurrency:
  group: storyteller-lite-p5-relaunch-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows relaunch recovery
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/p5-relaunch-recovery

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Apply rustfmt before validation
        run: cargo fmt --all

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Strict workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace

      - name: Build native Slint shell
        run: cargo build -p storyteller-ui

      - name: Commit validated formatting
        shell: bash
        run: |
          if git diff --quiet -- crates; then
            echo "No rustfmt changes to commit."
            exit 0
          fi
          git config user.name "storyteller-validation"
          git config user.email "actions@users.noreply.github.com"
          git add crates
          git commit -m "style: apply relaunch recovery rustfmt [skip ci]"
          git push origin HEAD:feature/p5-relaunch-recovery
