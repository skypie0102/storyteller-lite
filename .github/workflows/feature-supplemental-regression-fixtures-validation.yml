name: Supplemental regression fixture validation

on:
  push:
    branches:
      - feature/supplemental-regression-fixtures

permissions:
  contents: write

concurrency:
  group: supplemental-regression-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Apply supplemental regression fixture
        run: python .github/scripts/patch-supplemental-regression-fixtures.py

      - name: Apply Rust formatting
        run: cargo fmt --all

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Build native Slint shell
        run: cargo build -p storyteller-ui

      - name: Commit validated regression fixture
        shell: bash
        run: |
          if git diff --quiet -- crates; then
            echo "No regression fixture changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates
            git commit -m "test: cover supplemental Smart and manual EPUB output"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
