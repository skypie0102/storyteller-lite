name: Manual audio assignment validation

on:
  push:
    branches:
      - feature/manual-audio-assignment

permissions:
  contents: write

concurrency:
  group: manual-audio-assignment-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Wire effective reviewed alignment
        shell: pwsh
        run: |
          $assignmentPath = 'crates/storyteller-core/src/review_assignment.rs'
          $assignment = Get-Content -Raw $assignmentPath
          $assignment = $assignment.Replace("    section_index: usize,`n", '')
          $assignment = $assignment.Replace('    for (section_index, section) in corpus.sections.iter().enumerate() {', '    for section in &corpus.sections {')
          $assignment = $assignment.Replace('                section_index,', '')
          $needle = @'
              if review.total_segments != alignment.total_segments {
                  return Err("Audio review no longer matches the alignment segment count.".into());
              }
          '@
          $replacement = @'
              if review.total_segments != alignment.total_segments {
                  return Err("Audio review no longer matches the alignment segment count.".into());
              }
              if review.matched_segments != alignment.matched_segments {
                  return Err("Audio review no longer matches the source alignment matched count.".into());
              }
              let expected_unmatched = alignment
                  .segments
                  .iter()
                  .filter(|segment| segment.status == AlignmentStatus::Unmatched)
                  .count();
              if review.unmatched.len() != expected_unmatched {
                  return Err("Audio review does not contain a decision record for every unmatched alignment segment.".into());
              }
          '@
          if (-not $assignment.Contains($needle.Trim())) { throw 'Could not locate review coverage validation block.' }
          $assignment = $assignment.Replace($needle.Trim(), $replacement.Trim())
          Set-Content -NoNewline -Path $assignmentPath -Value $assignment

          $backendPath = 'crates/storyteller-ui/src/pipeline_backend.rs'
          $backend = Get-Content -Raw $backendPath
          $backend = $backend.Replace('encode_audiobook, extract_epub_corpus, prepare_job_sources, prepared_job_sources,', 'encode_audiobook, extract_epub_corpus, materialize_reviewed_alignment, prepare_job_sources, prepared_job_sources,')

          $oldCandidate = '        let candidate = stage_dir.join("readaloud.epub");'
          $newCandidate = "        let candidate = stage_dir.join(`"readaloud.epub`");`n        let reviewed_alignment = stage_dir.join(`"effective-alignment.json`");"
          if (-not $backend.Contains($oldCandidate)) { throw 'Could not locate Build EPUB candidate path.' }
          $backend = $backend.Replace($oldCandidate, $newCandidate)

          $oldAlignmentArg = '            &align_dir.join("alignment.json"),'
          if (-not $backend.Contains($oldAlignmentArg)) { throw 'Could not locate Build EPUB alignment argument.' }
          $backend = $backend.Replace($oldAlignmentArg, '            &reviewed_alignment,')

          $buildCall = '        let summary = build_readaloud_epub('
          if (-not $backend.Contains($buildCall)) { throw 'Could not locate Build EPUB call.' }
          $materialize = @'
                  materialize_reviewed_alignment(
                      &align_dir.join("alignment.json"),
                      &analyze_dir.join("book-corpus.json"),
                      &review_dir.join("review.json"),
                      &reviewed_alignment,
                  )
                  .map_err(|error| StageRunError::failed(error, self.elapsed_millis()))?;
                  let summary = build_readaloud_epub(
          '@
          $backend = $backend.Replace($buildCall, $materialize.Trim())

          $oldArtifacts = '            vec![PathBuf::from("readaloud.epub")],'
          if (-not $backend.Contains($oldArtifacts)) { throw 'Could not locate Build EPUB artifact list.' }
          $backend = $backend.Replace($oldArtifacts, '            vec![PathBuf::from("effective-alignment.json"), PathBuf::from("readaloud.epub")],')
          Set-Content -NoNewline -Path $backendPath -Value $backend

      - name: Apply Rust formatting
        run: cargo fmt --all

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Build native Slint shell
        run: cargo build -p storyteller-ui

      - name: Commit validated assignment wiring
        shell: bash
        run: |
          if git diff --quiet -- crates; then
            echo "No assignment wiring changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates
            git commit -m "feat: build from validated reviewed alignment"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
