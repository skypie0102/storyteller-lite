name: P5 managed runtime storage validation

on:
  pull_request:
    branches:
      - validation/p5-user-runtime-storage-base

permissions:
  contents: write

concurrency:
  group: storyteller-lite-p5-user-runtime-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows managed runtime validation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/p5-user-runtime-storage

      - name: Apply reviewed managed-runtime patch
        run: python .github/apply_p5_user_runtime_storage.py

      - name: Check patch whitespace
        shell: bash
        run: git diff --check

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Apply rustfmt before validation
        run: cargo fmt --all

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Strict workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace

      - name: Build native Slint shell
        run: cargo build -p storyteller-ui

      - name: Commit validated product files
        shell: bash
        run: |
          if git diff --quiet -- crates/storyteller-ui/src/runtime_setup.rs docs/RUNTIME.md .github/workflows/windows-build.yml; then
            echo "No product changes to commit."
            exit 0
          fi
          git config user.name "storyteller-validation"
          git config user.email "actions@users.noreply.github.com"
          git add crates/storyteller-ui/src/runtime_setup.rs docs/RUNTIME.md .github/workflows/windows-build.yml
          git commit -m "fix: store managed runtimes per user [skip ci]"
          git push origin HEAD:feature/p5-user-runtime-storage
