name: P5 managed runtime storage persistence

on:
  pull_request:
    branches:
      - validation/p5-user-runtime-storage-base

permissions:
  contents: write

concurrency:
  group: storyteller-lite-p5-user-runtime-persist-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  persist:
    name: Persist validated managed runtime files
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/p5-user-runtime-storage

      - name: Apply reviewed managed-runtime patch
        run: python .github/apply_p5_user_runtime_storage.py

      - name: Set up Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply validated formatting
        run: cargo fmt --all

      - name: Commit validated Rust and runtime docs
        shell: bash
        run: |
          git config user.name "storyteller-validation"
          git config user.email "actions@users.noreply.github.com"
          git add crates/storyteller-ui/src/runtime_setup.rs docs/RUNTIME.md
          git commit -m "fix: store managed runtimes per user [skip ci]"
          git push origin HEAD:feature/p5-user-runtime-storage
